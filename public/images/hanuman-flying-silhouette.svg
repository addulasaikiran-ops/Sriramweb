<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Flying Hanuman carrying the Sanjeevani mountain">
  <defs>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC107"/>
      <stop offset=".28" stop-color="#FF9933"/>
      <stop offset=".72" stop-color="#F46A0B"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFC107"/>
      <stop offset=".45" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#FF6D00"/>
    </linearGradient>
    <linearGradient id="mountain" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#FFC107"/>
      <stop offset=".37" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#FF9933" stop-opacity=".3"/>
      <stop offset=".46" stop-color="#E65100" stop-opacity=".12"/>
      <stop offset="1" stop-color="#E65100" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="herb-glow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>
    <style>
      .herb-light{transform-box:fill-box;transform-origin:center;animation:herb-twinkle 1.65s ease-in-out infinite alternate}
      .herb-light:nth-of-type(2n){animation-delay:-.7s}
      .herb-light:nth-of-type(3n){animation-delay:-1.1s}
      @keyframes herb-twinkle{from{opacity:.38;transform:scale(.72)}to{opacity:1;transform:scale(1.35)}}
      @media(prefers-reduced-motion:reduce){.herb-light{animation:none;opacity:.85}}
    </style>
  </defs>

  <!-- A restrained aura remains transparent outside the glow. -->
  <ellipse cx="747" cy="247" rx="390" ry="245" fill="url(#aura)" filter="url(#soft-glow)"/>

  <!-- Sanjeevani mountain: crisp outer silhouette with warm, luminous edges. -->
  <g id="sanjeevani-mountain">
    <path d="M767 219 793 194 807 194 827 171 849 165 864 140 879 133 898 91 918 112 938 73 958 98 977 55 995 82 1014 71 1034 101 1055 111 1065 132 1090 140 1106 162 1128 171 1147 193 1162 203 1152 219 1004 227 848 225 777 229Z" fill="url(#mountain)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
    <path d="m873 151 22-35 15 29 17-39 18 42 18-56 18 38 18-13 12 34 25 9 11 19-59-2-28-12-23 17-28-6-22 17-40-4Z" fill="#E65100" opacity=".34"/>
    <path d="M807 194 828 183 840 188 857 169 879 167 891 151 907 153 923 131 939 143 957 126 973 145 992 132 1007 154 1028 155 1042 176 1065 177 1077 191 1101 193 1122 209" fill="none" stroke="#FFC107" stroke-opacity=".72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Herb-covered trees along the ridge and ledges. -->
    <path d="M803 202 812 181 821 195 829 174 841 192 852 186 863 203ZM850 215 863 194 873 206 885 180 898 207 908 194 919 213ZM1016 213 1028 192 1039 211 1050 184 1064 209 1076 192 1091 214Z" fill="#FFB13B" opacity=".78"/>
    <path d="M841 193 856 185M879 204 889 194M1040 205 1051 196M1082 213 1094 205" stroke="#FFC107" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <g fill="#FFF0A6">
      <circle class="herb-light" cx="842" cy="201" r="2.7"/><circle cx="842" cy="201" r="6" opacity=".35" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="876" cy="188" r="2.4"/><circle cx="876" cy="188" r="6" opacity=".3" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="906" cy="207" r="2.8"/><circle cx="906" cy="207" r="7" opacity=".32" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="939" cy="174" r="2.5"/><circle cx="939" cy="174" r="6" opacity=".34" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="974" cy="193" r="2.8"/><circle cx="974" cy="193" r="7" opacity=".32" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="1016" cy="185" r="2.4"/><circle cx="1016" cy="185" r="6" opacity=".34" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="1052" cy="205" r="2.6"/><circle cx="1052" cy="205" r="6" opacity=".3" filter="url(#herb-glow)"/>
      <circle class="herb-light" cx="1090" cy="199" r="2.5"/><circle cx="1090" cy="199" r="6" opacity=".32" filter="url(#herb-glow)"/>
    </g>
  </g>

  <!-- Long S-curve tail and wind-swept cloth trail behind the flying figure. -->
  <g id="tail-and-fabric" fill="url(#saffron)" stroke="url(#rim)" stroke-linejoin="round">
    <path d="M572 318C518 308 473 280 486 245 497 217 468 196 435 208 412 216 408 238 423 251 434 261 450 257 453 246 446 251 437 246 440 236 446 219 469 230 461 249 449 278 477 307 520 332L554 350Z" stroke-width="3"/>
    <path d="M579 314C512 285 455 269 406 257 383 251 354 239 342 219L319 194 296 201 311 229C332 262 367 282 401 291L548 349Z" stroke-width="2.6"/>
    <path d="M596 343C533 359 481 353 432 331 393 314 368 311 346 323 379 322 393 347 430 359 473 376 534 377 578 365Z" stroke-width="2.5"/>
    <path d="M575 360C520 390 466 401 411 383 388 376 370 375 347 385 380 386 394 410 436 414 489 420 545 399 591 376Z" stroke-width="2.5"/>
    <path d="M594 385C538 415 489 443 438 441 418 440 401 448 392 462 416 450 432 465 463 458 511 448 565 423 612 398Z" stroke-width="2.5"/>
  </g>

  <!-- Flying Hanuman: the silhouette is one connected visual language, edged with warm gold. -->
  <g id="hanuman" fill="url(#saffron)" stroke="url(#rim)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Rear leg, extended into flight. -->
    <path d="M601 349C570 365 533 383 501 396L442 413C423 420 407 430 398 445L392 463 403 472 419 465 434 451 483 437 532 422 585 390Z"/>
    <!-- Front leg, bent and swept behind. -->
    <path d="M624 352C602 365 578 378 556 378L523 368 510 355 520 344 540 346 562 348 591 330Z"/>
    <!-- Dhoti folds trailing left. -->
    <path d="M626 339C590 349 564 368 540 390L572 393 604 376 637 364Z" stroke-width="2.1"/>
    <path d="M609 357 577 381M626 364 598 386" fill="none" stroke="#FFC107" stroke-width="2.4" opacity=".9"/>
    <!-- Main torso, chest and waist. -->
    <path d="M601 296C626 272 662 256 702 253L746 264 779 286 795 312 778 339 745 358 714 367 695 391 662 399 633 385 602 376 620 348 600 326Z"/>
    <!-- Neck, jaw, monkey muzzle and crown. -->
    <path d="M728 255 737 229 756 216 782 218 800 230 803 246 791 263 771 268 754 262Z"/>
    <path d="M741 226 738 211 746 193 761 197 769 185 783 198 797 199 804 216 793 228 777 215 761 222Z"/>
    <path d="M748 198 758 180 770 193 780 174 789 194 799 192 806 209 795 211 783 202 770 207 759 203Z"/>
    <!-- Eye/nose relief is deliberately minimal in silhouette style. -->
    <path d="M775 237 785 240 779 246" fill="none" stroke="#FFC107" stroke-width="2.8"/>
    <path d="M783 252 799 249 791 260 779 261Z" fill="#E65100" stroke-width="1.4"/>
    <!-- Raised arm supporting the mountain on the palm. -->
    <path d="M705 272C740 265 766 250 787 236L819 218 846 211 872 213 884 222 873 231 850 229 831 236 808 253 779 283 755 299 735 307Z"/>
    <!-- Palm, open fingers under the mountain. -->
    <path d="M860 220 874 214 891 215 908 220 919 227 916 233 906 231 897 228 885 230 872 231 862 227Z" stroke-width="2.2"/>
    <path d="M892 218 903 218M900 222 912 224M890 225 904 228" fill="none" stroke="#FFC107" stroke-width="2"/>
    <!-- Other arm extended behind, gripping the gada shaft. -->
    <path d="M679 276C647 263 618 246 589 236L552 227 525 229 510 237 519 246 543 245 566 250 595 266 630 289 657 304Z"/>
    <path d="M512 234 497 228 482 225 469 228 473 235 489 239 505 242Z" stroke-width="2.1"/>
    <!-- Gada/mace shaft and head, behind the hand. -->
    <path d="M489 235 412 184" fill="none" stroke="url(#rim)" stroke-width="8"/>
    <path d="M374 150 402 143 430 159 433 184 415 200 389 191 374 173Z"/>
    <path d="M379 160 422 185M385 151 429 176" fill="none" stroke="#FFC107" stroke-width="2.3"/>
    <!-- Armlets, waistband and sacred ornaments as simple silhouette cut-lines. -->
    <path d="M650 269 665 276M658 260 671 267M611 369 650 382 682 379" fill="none" stroke="#FFC107" stroke-width="5" opacity=".95"/>
    <path d="M639 281C661 295 681 306 708 313L733 322" fill="none" stroke="#FFC107" stroke-width="2.4" opacity=".86"/>
    <path d="M686 324 701 339 689 353 676 337Z" fill="#E65100" stroke="#FFC107" stroke-width="2.4"/>
    <!-- Feet and toes. -->
    <path d="M407 443 390 457 382 470 389 479 401 477 418 464" stroke-width="2.4"/>
    <path d="M399 472 389 470M402 476 395 477" fill="none" stroke="#FFC107" stroke-width="1.8"/>
  </g>

  <!-- Soft rim glints: gold only, no background plate or box. -->
  <g fill="none" stroke="#FFC107" stroke-linecap="round" opacity=".86">
    <path d="M736 229 754 216 781 218 794 229" stroke-width="2.6"/>
    <path d="M712 258 746 267 772 286" stroke-width="2.8"/>
    <path d="M779 282 807 253 832 235 850 229" stroke-width="2.6"/>
    <path d="M608 299 634 278 666 266" stroke-width="2.2"/>
    <path d="M599 379 631 390 658 400" stroke-width="2.4"/>
  </g>
</svg>